trainer:
  max_epochs: 15
  accelerator: gpu
  devices: auto
  precision: bf16-mixed

  gradient_clip_val: 1.0
  log_every_n_steps: 25
  accumulate_grad_batches: 2

optimizer:
  learning_rate: 1e-4
  min_learning_rate: 1e-6
  weight_decay: 0.04
  warmup_epochs: 5

batch_size_finder:
  mode: binsearch
  steps_per_trial: 2
  init_val: 16
  max_trials: 12
  batch_arg_name: batch_size

checkpoint: null

early_stopping: null
