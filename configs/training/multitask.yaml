trainer:
  max_epochs: 85
  accelerator: gpu
  devices: auto
  precision: bf16-mixed

  gradient_clip_val: 1.0
  log_every_n_steps: 25
  accumulate_grad_batches: 2

optimizer:
  learning_rate: 1e-4
  min_learning_rate: 1e-6
  weight_decay: 0.04
  warmup_epochs: 5

batch_size_finder:
  mode: binsearch
  steps_per_trial: 2
  init_val: 4
  max_trials: 8
  batch_arg_name: batch_size

checkpoint:
  monitor: val/raw_loss
  mode: min
  save_top_k: 1
  save_last: true
  every_n_epochs: 1

early_stopping:
  monitor: val/raw_loss
  mode: min
  patience: 15
  min_delta: 1e-5
  verbose: true
