[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "brain-ct-triage"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
  # Core
  "numpy (>=2,<2.3)",
  "scipy (<1.16)",

  # Data / metadata
  "pandas (>=2.3.3,<3)",
  "scikit-learn (>=1.8.0,<2)",
  "pydantic (>=2.12.5,<3)",
  "PyYAML (>=6.0.3,<7)",
  "omegaconf (>=2.3.0,<3.0.0)",

  # DICOM / medical imaging
  "pydicom (>=3.0.1,<4)",
  "pylibjpeg (>=2.1.0,<3)",
  "pylibjpeg-libjpeg (>=2.4,<3)",
  "pylibjpeg-openjpeg (>=2.5,<3)",
  "pylibjpeg-rle (>=2.2,<3)",
  "python-gdcm (>=3.2.6,<4)",
  "monai[clearml,einops,fire,segment-anything,tifffile] (>=1.5.1,<2)",

  # Deep learning / vision
  "torch (>=2.10,<3)",
  "lightning (>2.2.1,<=2.4.0)",
  "torchmetrics[detection] (>=1.8.2,<2)",
  "timm (>=1.0.22,<2)",
  "transformers (>=4.57.0,<4.58.0)",

  # CLI / utilities
  "click (>=8.1,<9)",
  "typer (>=0.20,<0.21.0)",
  "loguru (>=0.7.3,<0.8.0)",
  "tqdm (>=4.67.1,<5)",
  "tensorboard (>=2.20,<3)",
]


[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "matplotlib>=3.9,<4", "seaborn>=0.13,<1"]

dev = ["pytest>=8,<9", "ruff>=0.9,<1", "pyright>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "scripts", "tests"]

[tool.isort]
profile = "black"
line_length = 88
