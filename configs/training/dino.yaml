trainer:
  max_epochs: 75
  accelerator: gpu
  devices: auto
  precision: bf16-mixed

  gradient_clip_val: 1.0
  log_every_n_steps: 25
  accumulate_grad_batches: 2

optimizer:
  learning_rate: 5e-5
  min_learning_rate: 1e-7
  weight_decay: 0.04
  warmup_epochs: 10

batch_size_finder:
  mode: binsearch
  steps_per_trial: 3
  init_val: 4
  max_trials: 4
  batch_arg_name: batch_size

checkpoint:
  monitor: train/loss_epoch
  mode: min
  save_top_k: 1
  save_last: true
  every_n_epochs: 1

early_stopping: null
